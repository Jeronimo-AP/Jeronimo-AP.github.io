<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cataleya Leather Shop</title>

    <link rel="stylesheet" href="../../scss/styles.css" />
    <link
        rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
        crossorigin="anonymous"
    />
</head>

<body>
    <header>
        <div class="menu-btn">
            <div class="btn-line"></div>
            <div class="btn-line"></div>
            <div class="btn-line"></div>
        </div>

        <nav class="menu">
            <div class="menu-branding">
                <div class="mypicture"></div>
            </div>
            <ul class="menu-nav">
                <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="../about.html" class="nav-link">About</a></li>
                <li class="nav-item current"><a href="../work.html" class="nav-link">My Work</a></li>
                <li class="nav-item"><a href="../contact.html" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="large-heading">
            Cataleya <span class="text-secondary">Leather Goods</span>
        </h1>

        <h2 class="small-heading">
            A lightweight, dynamic catalog website powered by Google Sheets.
        </h2>

        <div class="project-details">
            <div class="feature-selector">
                <button data-feature="landing" class="active">Landing</button>
                <button data-feature="catalog">Catalog</button>
                <button data-feature="product">Product View</button>
                <button data-feature="system">Product System</button>
                <button data-feature="tech">Technology</button>
            </div>

            <div class="project-showcase">
                <div class="showcase-image">
                <img id="featureImage" alt="Cataleya preview" />
                <video id="featureVideo" class="hidden" muted loop playsinline></video>
                </div>

                <div class="showcase-info">
                <h3 id="featureTitle"></h3>
                <p id="featureDescription"></p>

                <ul class="feature-list"></ul>

                <div class="item project-card">
                    <a
                    href="https://mrmxyzptlk-jpg.github.io/artisan-leather-website/"
                    class="btn-light"
                    target="_blank"
                    >
                    <i class="fas fa-store"></i> Live Site
                    </a>

                    <a
                    href="https://github.com/MrMxyzptlk-jpg/artisan-leather-website.git"
                    class="btn-dark"
                    target="_blank"
                    >
                    <i class="fab fa-github"></i> Source
                    </a>
                </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="main-footer">&copy; 2026</footer>

    <canvas id="bg-simulation"></canvas>

    <script type="module" src="../../js/bg-sim.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../js/main.js"></script>

    <script type="module">
        import { cataleyaFeatures } from "../../js/projects/en/cataleya-shop.js";
        import { initProjectShowcase } from "../../js/project-showcase.js";

        initProjectShowcase(cataleyaFeatures);

        requestAnimationFrame(() => {
        document.querySelector('[data-feature="landing"]')?.click();
        });
    </script>
</body>
</html>
