<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licentiate Degree's Presentation</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous">
    <link rel="stylesheet" href="../../scss/styles.css">
</head>

<body>
    <header>
        <div class="menu-btn">
            <div class="btn-line"></div>
            <div class="btn-line"></div>
            <div class="btn-line"></div>
        </div>

        <nav class="menu">
            <div class="menu-branding">
                <div class="mypicture"></div>
            </div>
            <ul class="menu-nav">
                <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="../about.html" class="nav-link">About</a></li>
                <li class="nav-item current"><a href="../work.html" class="nav-link">My Work</a></li>
                <li class="nav-item"><a href="../contact.html" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="large-heading">
            Licentiate Degree's <span class="text-secondary">Presentation</span>
        </h1>

        <h2 class="small-heading">
            A custom, non-linear web-based presentation system designed for live scientific storytelling and real-time data exploration.
        </h2>

        <div class="project-details">
            <!-- FEATURE SELECTOR -->
            <div class="feature-selector">
                <button data-feature="structure" class="active">Structure</button>
                <button data-feature="tech">Technology</button>
                <button data-feature="interactivity">Interactivity</button>
                <button data-feature="visuals">Visuals</button>
                <button data-feature="purpose">Design Goals</button>
            </div>

            <div class="project-showcase">

                <!-- TEXT PANEL -->
                <div class="showcase-info">
                    <h3 id="featureTitle"></h3>

                    <p id="featureDescription"></p>

                    <ul class="feature-list"></ul>

                    <div class="item project-card">
                        <a href="https://mrmxyzptlk-jpg.github.io/Graduate_Presentation/" class="btn-light" target="_blank">
                            <i class="fas fa-book"></i> Licentiate Degree's Presentation
                        </a>
                        <a href="https://github.com/MrMxyzptlk-jpg/Graduate_Presentation" class="btn-dark" target="_blank">
                            <i class="fab fa-github"></i> Source
                        </a>
                    </div>
                </div>
                <!-- IMAGE PANEL -->
                <div class="showcase-image"></div>
            </div>

            <!-- IMAGE MODAL -->
            <div class="image-modal" id="imageModal">
                <span class="close-modal">&times;</span>
                <img class="modal-content" id="modalImage">
            </div>


        </div>
    </main>

    <footer id="main-footer">
    &copy; 2026
    </footer>

    <canvas id="bg-simulation"></canvas>

    <script type="module" src="../../js/bg-sim.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../js/main.js"></script>
    <script type="module">
        import { projectFeatures } from "../../js/projects/lic-presentation.js";
        import { initProjectShowcase } from "../../js/project-showcase.js";

        initProjectShowcase(projectFeatures);
        requestAnimationFrame(() => { document.querySelector('[data-feature="structure"]')?.click(); });
    </script>
</body>
</html>
