<!DOCTYPE html>
<html lang="es"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación de Licenciatura</title> <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous">
    <link rel="stylesheet" href="../../scss/styles.css">
</head>

<body>
    <header>
        <div class="menu-btn">
            <div class="btn-line"></div>
            <div class="btn-line"></div>
            <div class="btn-line"></div>
        </div>

        <nav class="menu">
            <div class="menu-branding">
                <div class="mypicture"></div>
            </div>
            <ul class="menu-nav">
                <li class="nav-item"><a href="../index.html" class="nav-link">Inicio</a></li>
                <li class="nav-item"><a href="../about.html" class="nav-link">Sobre Mí</a></li>
                <li class="nav-item current"><a href="../work.html" class="nav-link">Mis Trabajos</a></li>
                <li class="nav-item"><a href="../contact.html" class="nav-link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="large-heading">
            Presentación de <span class="text-secondary">Licenciatura</span> </h1>

        <h2 class="small-heading">
            Un sistema de presentación web personalizado y no lineal, diseñado para la narrativa científica en vivo y la exploración de datos en tiempo real.
        </h2>

        <div class="project-details">
            <div class="feature-selector">
                <button data-feature="structure" class="active">Estructura</button>
                <button data-feature="tech">Tecnología</button>
                <button data-feature="interactivity">Interactividad</button>
                <button data-feature="visuals">Visuales</button>
                <button data-feature="purpose">Objetivos</button>
            </div>

            <div class="project-showcase">

                <div class="showcase-info">
                    <h3 id="featureTitle"></h3>

                    <p id="featureDescription"></p>

                    <ul class="feature-list"></ul>

                    <div class="item project-card">
                        <a href="https://mrmxyzptlk-jpg.github.io/Graduate_Presentation/" class="btn-light" target="_blank">
                            <i class="fas fa-book"></i> Ver Presentación
                        </a>
                        <a href="https://github.com/MrMxyzptlk-jpg/Graduate_Presentation" class="btn-dark" target="_blank">
                            <i class="fab fa-github"></i> Código Fuente
                        </a>
                    </div>
                </div>
                <div class="showcase-image"></div>
            </div>

            <div class="image-modal" id="imageModal">
                <span class="close-modal">&times;</span>
                <img class="modal-content" id="modalImage">
            </div>


        </div>
    </main>

    <footer id="main-footer">
    &copy; 2026
    </footer>

    <canvas id="bg-simulation"></canvas>

    <script type="module" src="../../js/bg-sim.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../js/main.js"></script>
    <script type="module">
        import { projectFeatures } from "../../js/projects/es/lic-presentation.js";
        import { initProjectShowcase } from "../../js/project-showcase.js";

        initProjectShowcase(projectFeatures);
        // Force click on Structure to load initial content
        requestAnimationFrame(() => { document.querySelector('[data-feature="structure"]')?.click(); });
    </script>
</body>
</html>
